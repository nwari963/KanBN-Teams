services:
  outline:
    image: outlinewiki/outline:latest
    container_name: otsical-outline
    ports:
      - "3458:3458"
    environment:
      - NODE_ENV=production
      - URL=${OUTLINE_URL}
      - PORT=3458
      - SECRET_KEY=${OUTLINE_SECRET_KEY}
      - UTILS_SECRET=${OUTLINE_UTILS_SECRET}
      - DATABASE_URL=postgres://outline:${OUTLINE_PG_PASSWORD}@outline-postgres:5432/outline
      - PGSSLMODE=disable
      - REDIS_URL=redis://outline-redis:6379
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      - FILE_STORAGE_UPLOAD_MAX_SIZE=262144000
      - FORCE_HTTPS=false
      - WEB_CONCURRENCY=1
      - OIDC_CLIENT_ID=otsical-outline
      - OIDC_CLIENT_SECRET=${DEX_STATIC_CLIENT_SECRET}
      - OIDC_AUTH_URI=http://MacBook-Pro-de-Angelo.local:3459/dex/auth
      - OIDC_TOKEN_URI=http://MacBook-Pro-de-Angelo.local:3459/dex/token
      - OIDC_USERINFO_URI=http://MacBook-Pro-de-Angelo.local:3459/dex/userinfo
      - OIDC_USERNAME_CLAIM=preferred_username
      - OIDC_DISPLAY_NAME=OTSICAL Studio
      - OIDC_SCOPES=openid profile email
    volumes:
      - outline-data:/var/lib/outline/data
      - ./dex/config.local.yaml:/etc/dex/config.docker.yaml:ro
    depends_on:
      outline-postgres:
        condition: service_healthy
      outline-redis:
        condition: service_started
      dex:
        condition: service_healthy
      lldap:
        condition: service_started
    restart: unless-stopped

  outline-postgres:
    image: postgres:16-alpine
    container_name: otsical-outline-db
    environment:
      - POSTGRES_PASSWORD=${OUTLINE_PG_PASSWORD}
      - POSTGRES_USER=outline
      - POSTGRES_DB=outline
    volumes:
      - outline-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  outline-redis:
    image: redis
    container_name: otsical-outline-redis
    restart: unless-stopped

  dex:
    image: dexidp/dex:v2.45.1
    container_name: otsical-dex
    ports:
      - "3459:5556"
    environment:
      - DEX_STATIC_CLIENT_SECRET=${DEX_STATIC_CLIENT_SECRET}
      - DEX_KAN_CLIENT_SECRET=${DEX_KAN_CLIENT_SECRET}
      - LLDAP_LDAP_USER_PASS=${LLDAP_LDAP_USER_PASS}
    volumes:
      - ./dex/config.local.yaml:/etc/dex/config.docker.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5556/dex/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  lldap:
    image: ghcr.io/lldap/lldap:2026-07-19-debian
    container_name: otsical-lldap
    ports:
      - "3460:17170"
    environment:
      - LLDAP_LDAP_HOST=0.0.0.0
      - LLDAP_LDAP_PORT=3890
      - LLDAP_HTTP_HOST=0.0.0.0
      - LLDAP_HTTP_PORT=17170
      - LLDAP_HTTP_URL=${LLDAP_HTTP_URL}
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET}
      - LLDAP_KEY_SEED=${LLDAP_KEY_SEED}
      - LLDAP_LDAP_BASE_DN=${LLDAP_LDAP_BASE_DN}
      - LLDAP_LDAP_USER_DN=admin
      - LLDAP_LDAP_USER_PASS=${LLDAP_LDAP_USER_PASS}
      - LLDAP_DATABASE_URL=sqlite:///data/users.db?mode=rwc
    volumes:
      - lldap-data:/data
    restart: unless-stopped

volumes:
  outline-data:
  outline-postgres-data:
  lldap-data:
